<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <link rel="stylesheet" href="../../vendor/tdesign.min.css" />
    <link rel="stylesheet" href="../../vendor/iconfont.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>分组管理 · 示意</title>
    <link rel="icon" href="../../_shared/favicon.svg" />
    <link rel="stylesheet" href="../../_shared/theme.css" />
    <link rel="stylesheet" href="../../_shared/ids-admin.css" />
    <style>
      .proto-filter .proto-input { width: 200px; }
      .ops .link.is-blocked { color: var(--proto-text-disabled); cursor: not-allowed; }
    </style>
    <link rel="stylesheet" href="../../_shared/itc-adapter.css" />
    <script src="../../_shared/itc-adapter.js" defer></script>
  </head>
  <body data-proto-page="list" data-proto-l1="schedule">
    <div class="proto-shell">
      <aside class="proto-side">
        <div class="proto-side-logo"><div class="proto-side-logo-mark">D</div></div>
        <nav class="proto-side-menu">
          <a class="proto-side-item" data-page="hub" href="hub.html"><span class="proto-side-icon"></span>目录</a>
          <a class="proto-side-item" data-page="schedule" href="#"><span class="proto-side-icon"></span>信号调度</a>
        </nav>
      </aside>
      <div class="proto-body">
        <header class="proto-header">
          <div class="proto-header-left">
            <a class="proto-header-brand proto-brand-link" href="hub.html" title="返回原型目录">
              <span class="proto-brand-logo" aria-hidden="true"></span>
              <span class="proto-brand-name">分布式视频管理</span>
            </a>
            <button type="button" class="proto-fold-sub" id="proto-fold-sub" title="收起二级菜单">☰</button>
            <nav class="proto-breadcrumb">
              <a href="hub.html">原型目录</a><span>/</span><span>信号调度</span><span>/</span><span class="current">分组管理</span>
            </nav>
          </div>
          <div class="proto-header-right">
            <span class="proto-header-meta">示意 · REQ-2026-0001 · PAGE-DVS-001 · 2026-10-19 · 非需求正文</span>
            <span class="proto-header-user" id="header-user">管理员</span>
          </div>
        </header>
        <main class="proto-main">
          <aside class="proto-side-sub">
            <div class="proto-side-sub-group is-open">
              <button type="button" class="proto-side-sub-parent">
                <span class="proto-menu-ico"></span><span class="proto-menu-label">信号调度</span><span class="proto-menu-caret">▾</span>
              </button>
              <div class="proto-side-sub-children">
                <a class="is-active" data-page="list" href="#">分组管理</a>
                <a data-page="wall-list" href="wall-list.html">拼墙管理</a>
                <a data-page="screen-schedule" href="screen-schedule.html">画面调度</a>
              </div>
            </div>
            <div class="proto-side-sub-group">
              <button type="button" class="proto-side-sub-parent">
                <span class="proto-menu-ico"></span><span class="proto-menu-label">设备管理</span><span class="proto-menu-caret">▾</span>
              </button>
              <div class="proto-side-sub-children">
                <a data-page="device-list" href="device-list.html">设备列表</a>
              </div>
            </div>
          </aside>
          <div class="proto-content">
            <section class="proto-card">
              <div class="proto-filter">
                <div class="proto-field">
                  <label for="kw">分组名称</label>
                  <input id="kw" class="proto-input" type="text" maxlength="20" placeholder="请输入分组名称" />
                </div>
                <div class="proto-filter-actions">
                  <button type="button" class="proto-btn" id="btn-reset">重置</button>
                </div>
              </div>
              <div class="proto-toolbar">
                <div class="proto-toolbar-left">
                  <button type="button" class="proto-btn proto-btn-primary" id="btn-new"><i class="t-icon t-icon-add-circle" aria-hidden="true"></i>新建分组</button>
                </div>
              </div>
              <div class="proto-table-wrap">
                <table class="proto-table" id="group-table">
                  <thead>
                    <tr>
                      <th class="num col-idx">序号</th>
                      <th class="col-name">分组名称</th>
                      <th class="num col-count">拼墙数量</th>
                      <th class="col-time">创建时间</th>
                      <th class="ops col-ops is-ops-3">操作</th>
                    </tr>
                  </thead>
                  <tbody id="group-tbody"></tbody>
                </table>
                <div class="proto-empty" id="group-empty" style="display: none"></div>
              </div>
              <div class="proto-pagination">
                <span id="pager-total">共 0 项数据</span>
                <div class="proto-pagination-controls">
                  <select class="proto-select proto-page-size" id="pager-size" aria-label="每页条数">
                    <option>8 条/页</option>
                  </select>
                  <button type="button" class="proto-page proto-page-arrow" id="pager-prev" aria-label="上一页"><i class="t-icon t-icon-chevron-left" aria-hidden="true"></i></button>
                  <button type="button" class="proto-page is-active" id="pager-num">1</button>
                  <button type="button" class="proto-page proto-page-arrow" id="pager-next" aria-label="下一页"><i class="t-icon t-icon-chevron-right" aria-hidden="true"></i></button>
                </div>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <div class="proto-drawer-mask" id="drawer-name" hidden>
      <aside class="proto-drawer" role="dialog" aria-modal="true">
        <div class="proto-drawer-header">
          <span id="drawer-title">新建分组</span>
          <button type="button" class="proto-drawer-close" data-drawer-close aria-label="关闭">×</button>
        </div>
        <div class="proto-drawer-body">
          <div class="proto-field" id="field-name">
            <label for="input-name">分组名称<span class="req">*</span></label>
            <input id="input-name" class="proto-input" type="text" maxlength="20" placeholder="请输入分组名称（20 字以内）" />
            <div class="err" id="name-err" style="display: none"></div>
            <div class="hint">20 字以内；不可与已有分组重名（判重不分大小写、忽略首尾空格）</div>
          </div>
        </div>
        <div class="proto-drawer-footer">
          <button type="button" class="proto-btn" data-drawer-close>取消</button>
          <button type="button" class="proto-btn proto-btn-primary" id="btn-save">保存</button>
        </div>
      </aside>
    </div>

    <script src="../../_shared/proto-shell.js"></script>
    <script src="../../_shared/api.js"></script>
    <script src="../../_shared/platform-store.js"></script>
    <script>
      (function () {
        var store = DvsPlatformStore;
        var PAGE_SIZE = 8;
        var isAdmin = true;
        var keyword = "";
        var page = 1;
        var editingId = null;

        function $(id) { return document.getElementById(id); }
        function setHeaderUser(name) {
          var user = $("header-user"), label = user.querySelector("span");
          if (label) label.textContent = name;
          else user.textContent = name;
        }
        function pad(n) { return n < 10 ? "0" + n : String(n); }
        function esc(s) {
          return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function filtered() {
          var k = keyword.trim();
          var groups = store.listGroups();
          if (!k) return groups;
          return groups.filter(function (g) { return g.name.indexOf(k) >= 0; });
        }

        function render() {
          var all = filtered();
          var maxPage = Math.max(1, Math.ceil(all.length / PAGE_SIZE) || 1);
          if (page > maxPage) page = maxPage;
          var start = (page - 1) * PAGE_SIZE;
          var slice = all.slice(start, start + PAGE_SIZE);
          $("pager-total").textContent = "共 " + all.length + " 项数据";
          $("pager-num").textContent = String(page);
          $("pager-prev").disabled = page === 1;
          $("pager-next").disabled = page === maxPage;
          $("btn-new").style.display = isAdmin ? "" : "none";
          setHeaderUser("管理员");
          var tbody = $("group-tbody"), empty = $("group-empty"), table = $("group-table");
          if (!slice.length) {
            tbody.innerHTML = "";
            table.style.display = "none";
            empty.style.display = "block";
            empty.textContent = store.listGroups().length
              ? "未找到与「" + keyword.trim() + "」匹配的分组"
              : "暂无分组，点击「新建分组」创建";
            return;
          }
          table.style.display = "table";
          empty.style.display = "none";
          tbody.innerHTML = slice.map(function (g, i) {
            var ops = '<button type="button" class="link btn-enter" data-id="' + g.id + '">进入</button>';
            if (isAdmin) {
              ops += '<button type="button" class="link btn-rename" data-id="' + g.id + '">重命名</button>';
              ops += g.wallCount > 0
                ? '<button type="button" class="link is-blocked btn-del" data-id="' + g.id + '" title="该分组下还有 ' + g.wallCount + ' 面拼墙，请先移走或删除">删除</button>'
                : '<button type="button" class="link btn-del" data-id="' + g.id + '">删除</button>';
            }
            return (
              "<tr><td class=\"num col-idx\">" + pad(start + i + 1) +
              "</td><td class=\"col-name\">" + esc(g.name) +
              '</td><td class="num col-count">' + g.wallCount +
              "</td><td class=\"col-time\">" + g.createdAt +
              '</td><td class="ops col-ops">' + ops + "</td></tr>"
            );
          }).join("");
        }

        function showErr(msg) {
          $("field-name").classList.add("is-error");
          $("name-err").style.display = "block";
          $("name-err").textContent = msg;
        }
        function clearErr() {
          $("field-name").classList.remove("is-error");
          $("name-err").style.display = "none";
        }

        function openDrawer(mode, g) {
          editingId = mode === "rename" ? g.id : null;
          $("drawer-title").textContent = mode === "rename" ? "重命名分组" : "新建分组";
          $("input-name").value = mode === "rename" ? g.name : "";
          clearErr();
          protoOpenDrawer("drawer-name");
          $("input-name").focus();
        }

        function save() {
          var name = $("input-name").value;
          var t = name.trim();
          if (!t) { showErr("请输入分组名称"); return; }
          if (t.length > 20) { showErr("名称不能超过 20 个字符"); return; }
          var tl = t.toLocaleLowerCase();
          var dup = store.listGroups().some(function (g) {
            return g.id !== editingId && g.name.trim().toLocaleLowerCase() === tl;
          });
          if (dup) { showErr("该分组名称已存在"); return; }
          var btn = $("btn-save");
          btn.disabled = true;
          var op = editingId ? store.renameGroup(editingId, t) : store.createGroup(t);
          op.then(function () {
            btn.disabled = false;
            protoCloseDrawer("drawer-name");
            protoToast("保存成功");
            render();
          }, function (error) {
            btn.disabled = false;
            showErr(error.message);
          });
        }

        $("kw").addEventListener("keydown", function (e) {
          if (e.key === "Enter") { keyword = $("kw").value || ""; page = 1; render(); }
        });
        $("btn-reset").onclick = function () { $("kw").value = ""; keyword = ""; page = 1; render(); };
        $("btn-new").onclick = function () { openDrawer("new", null); };
        $("btn-save").onclick = save;
        $("pager-prev").onclick = function () { if (page > 1) { page--; render(); } };
        $("pager-next").onclick = function () {
          var maxPage = Math.max(1, Math.ceil(filtered().length / PAGE_SIZE) || 1);
          if (page < maxPage) { page++; render(); }
        };

        $("group-tbody").addEventListener("click", function (e) {
          var enter = e.target.closest(".btn-enter");
          var rename = e.target.closest(".btn-rename");
          var del = e.target.closest(".btn-del");
          if (enter) {
            var target = store.getGroup(enter.getAttribute("data-id"));
            if (!target) return;
            store.setCurrentGroup(target.id);
            window.location.href = "wall-list.html?groupId=" + encodeURIComponent(target.id);
            return;
          }
          if (rename) {
            var rg = store.getGroup(rename.getAttribute("data-id"));
            if (rg) openDrawer("rename", rg);
            return;
          }
          if (del) {
            var g = store.getGroup(del.getAttribute("data-id"));
            if (!g) return;
            if (g.wallCount > 0) {
              protoToast("该分组下还有 " + g.wallCount + " 面拼墙，请先移走或删除");
              return;
            }
            protoConfirm({
              title: "删除确认",
              content: "确认删除分组「" + g.name + "」？删除后不可恢复。",
              onOk: function () {
                store.deleteGroup(g.id).then(function () {
                  protoToast("删除成功");
                  render();
                }, function (error) { protoToast(error.message); });
              }
            });
          }
        });

        store.subscribe(render);
        render();
      })();
    </script>
  </body>
</html>
