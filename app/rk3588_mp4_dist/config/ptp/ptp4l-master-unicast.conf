# PC Grandmaster — linuxptp >= 2.0, UDPv4 unicast (no multicast)
[global]
time_stamping              software
network_transport          UDPv4
delay_mechanism            E2E
domainNumber               0
logSyncInterval            0
logAnnounceInterval        1
inhibit_multicast_service  1
hybrid_e2e                 1
masterOnly                 1

# Replace enp1s0 with your TX NIC
[enp1s0]
unicast_listen             1
