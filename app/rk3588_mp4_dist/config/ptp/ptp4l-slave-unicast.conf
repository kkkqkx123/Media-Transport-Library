# RK3588 Slave — linuxptp >= 2.0, UDPv4 unicast to PC master
[global]
time_stamping              software
network_transport          UDPv4
delay_mechanism            E2E
domainNumber               0
logSyncInterval            0
logAnnounceInterval        1
inhibit_multicast_service  1
hybrid_e2e                 1
clientOnly                 1
unicast_req_duration       3600

[unicast_master_table]
table_id                   1
logQueryInterval           0
UDPv4                      192.168.80.213

[eth0]
unicast_master_table       1
